
<div class="site-visitor-counter" id="site-visitor-counter"></div>

<script>
(function () {
  const timer = setInterval(function () {
    if (!window.goatcounter?.visit_count) return;

    clearInterval(timer);

    window.goatcounter.visit_count({
    append: "#site-visitor-counter",
    type: "html",
    path: "/",
    attr: {
      width: "200",
      height: "80"
    },
    style: `
      html body div {
      box-sizing: border-box !important;
      background: #fbfbf8 !important;
      border: 1px solid #bfc5ba !important;
      border-radius: 0 !important;
      color: #252b27 !important;
      font-family: monospace !important;
      text-align: center !important;
    }

    html body #gcvc-for {
      color: #252b27 !important;
      font-size: 12px !important;
    }

    html body #gcvc-views {
      color: #526b46 !important;
      font-size: 24px !important;
      font-weight: bold !important;
    }

    html body #gcvc-by {
      color: #526b46 !important;
      font-size: 10px !important;
    }
    `});
  }, 100);

  setTimeout(function () {
    clearInterval(timer);
  }, 10000);
})();
</script>
