{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
  {{ if eq .Section "projects" }}
    <p>
      <time datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "January 2006" }}
      </time>
    </p>
  {{ end }}
  {{ .Content }}
{{ end }}
