<div class="site-header">
  <a class="site-name" href="{{ site.Home.RelPermalink }}">
    {{ site.Title }}
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    {{ $currentPage := . }}
    {{ range site.Menus.main }}
      {{ $active := $currentPage.IsMenuCurrent .Menu . }}
      {{ $ancestor := $currentPage.HasMenuCurrent .Menu . }}
      <a
        href="{{ .URL | relURL }}"
        {{ if or $active $ancestor }}class="active"{{ end }}
        {{ if $active }}aria-current="page"{{ end }}
      >{{ .Name }}</a>
    {{ end }}
  </nav>

</div>
