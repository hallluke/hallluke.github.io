
<div class="site-visitor-counter" id="site-visitor-counter"></div>

<script>
(function () {
  const timer = setInterval(function () {
    if (!window.goatcounter?.visit_count) return;

    clearInterval(timer);

    window.goatcounter.visit_count({
    append: "#site-visitor-counter",
    type: "html",
    path: "/",
    attr: {
      width: "200",
      height: "80"
    },
    style: "div { background: red; }"
    });
  }, 100);

  setTimeout(function () {
    clearInterval(timer);
  }, 10000);
})();
</script>
