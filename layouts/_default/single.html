{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ .Content }}
  {{ partial "project-navigation.html" . }}
  {{ if eq .Section "projects" }}
    <div class="project-meta">
      <p class="project-date">
        Initial release: 
        <time datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "2006-01" }}
        </time>
      </p>
      {{ with .Params.status }}
      <p class="project-status">
        Status:
        <span>{{ . | humanize }}</span>
      </p>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
