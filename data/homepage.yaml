# Examples to copy when populating the list

_examples:
    book:
      name: "Book Title"
      type: book
      by: "Author Name"
      date: "YYYY-MM-DD"

    album:
      name: "Album Title"
      type: album
      by: "Artist or Band"
      date: "YYYY-MM-DD"

    song:
      name: "Song Title"
      type: song
      by: "Artist or Band"
      date: "YYYY-MM-DD"

    podcast:
      name: "Podcast Name"
      type: podcast
      date: "YYYY-MM-DD"

    podcast_episode:
      name: "Episode Title"
      type: podcast_episode
      from: "Podcast Name"
      date: "YYYY-MM-DD"

    band:
      name: "Band Name"
      type: band
      date: "YYYY-MM-DD"

    gig:
      name: "Performer or Band"
      type: gig
      at: "Venue Name"
      date: "YYYY-MM-DD"

    exhibition:
      name: "Exhibition Title"
      type: exhibition
      by: "Artist Name"
      at: "Gallery or Venue"
      date: "YYYY-MM-DD"

    film:
      name: "Film Title"
      type: film
      by: "Director Name"
      at: "Cinema or Venue"
      date: "YYYY-MM-DD"

    theatre:
      name: "Production Title"
      type: theatre
      by: "Company or Writer"
      at: "Theatre or Venue"
      date: "YYYY-MM-DD"

    live_show:
      name: "Show Name"
      type: live_show
      by: "Performer or Company"
      at: "Venue Name"
      date: "YYYY-MM-DD"

    museum:
      name: "Museum Name"
      type: museum
      at: "Location"
      date: "YYYY-MM-DD"