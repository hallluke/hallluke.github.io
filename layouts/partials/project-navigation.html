{{ if eq .Section "projects" }}
  <nav class="project-navigation" aria-label="Project navigation">
    {{ with .NextInSection }}
      <a href="{{ .RelPermalink }}" class="project-navigation__prev">
        <span class="project-navigation__label">← Previous project</span>
        <span>{{ .Title }}</span>
      </a>
    {{ end }}

    {{ with .PrevInSection }}
      <a href="{{ .RelPermalink }}" class="project-navigation__next">
        <span class="project-navigation__label">Next project →</span>
        <span>{{ .Title }}</span>
      </a>
    {{ end }}
  </nav>
{{ end }}
