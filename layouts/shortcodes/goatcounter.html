<div class="site-visitor-counter">
  <span class="site-visitor-counter__label">Visitor count</span>
  <span class="site-visitor-counter__number" id="homepage-views" aria-live="off">—</span>
</div>

<script>
(() => {
  const counter = document.getElementById("homepage-views");
  if (!counter) return;

  fetch("https://lukehall.goatcounter.com/counter//.json")
    .then(response => {
      if (!response.ok) {
        throw new Error(`GoatCounter HTTP ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      if (typeof data.count !== "string") {
        throw new Error("Unexpected GoatCounter response");
      }

      const digits = data.count.replace(/\D/g, "");

      counter.replaceChildren();

      for (const digit of digits) {
        const span = document.createElement("span");
        span.className = "site-visitor-counter__digit";
        span.textContent = digit;
        span.setAttribute("aria-hidden", "true");
        counter.appendChild(span);
      }

      counter.setAttribute(
        "aria-label",
        `${digits} homepage views`
      );
    })
    .catch(error => {
      console.warn("Could not load homepage count:", error);
      counter.textContent = "—";
    });
})();
</script>
